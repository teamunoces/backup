<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style id="anti-fouc">
    html,
    body {
        margin: 0;
        min-height: 100%;
        background-color: #f4f7f9;
    }

    #headerFrame {
        background-color: #ffffff;
    }

    #sidebarFrame {
        background-color: #254911;
    }
</style>
    <title>Coordinator Dashboard</title>
 
    <link rel="stylesheet" href="dashboard.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./darkmode.css">
</head>
<body>

<!-- Header -->
    <iframe 
        src="http://localhost/SYSTEM_VERSION_!/coordinator/Profile/profile.html"
        id="headerFrame"
        frameborder="0"
        scrolling="no"
        title="Header">
    </iframe>

    <!-- Sidebar -->
    <iframe 
        src="http://localhost/SYSTEM_VERSION_!/coordinator/Sidebar/sidebar.html" 
        id="sidebarFrame"
        frameborder="0"
        scrolling="no"
        title="Navigation Sidebar">
    </iframe>


    <div class="dashboard-wrapper">
       
        <div class="main">
      
            <main>

                      <!-- Community Needs Assessment -->
                <div class="community-assessment-section">
                    <div class="section-header">
                        <h2>COMMUNITY NEEDS ASSESSMENT CONSOLIDATED RESULT</h2>
                        <button class="view-all-btn"onclick="window.location.href='./consolidated_result/cnacr.html'">
                            <i class="fas fa-external-link-alt"></i> View All
                        </button>
                    </div>

                    <h3 class="barangay-title">BARANGAY</h3>
                    <div class="chart-container" style="width:100%; height:400px;">
                            <canvas id="barangayChart"></canvas>
                    </div>

                </div>
                
                <!-- 3-Year Development Plan Progress -->
                <section class="development-plan-section">
                    <div class="plan-toolbar">
                        <h2>3-YEAR DEVELOPMENT PLAN PROGRESS</h2>
                        <div class="plan-year-filter">
                            <label for="planYearFilter">Year:</label>
                            <select id="planYearFilter">
                                <option value="all">All Years</option>
                            </select>
                        </div>
                    </div>

                    <div class="plan-status-stage">
                        <div class="plan-status-title">STATUS</div>
                        <div class="plan-timeline" id="planTimeline">
                            <div class="plan-empty-state">Loading development plans...</div>
                        </div>
                    </div>

                    <div class="plan-program-panel">
                        <div class="plan-panel-heading">PLAN</div>
                        <div id="planProgramList" class="plan-program-list">
                            <div class="plan-empty-state">Select a plan to view its programs.</div>
                        </div>
                    </div>
                </section>

               <!-- PENDING -->
                  <section class="card-section">
                      <div class="header-banner green">PENDING APPROVAL</div>

                      <div class="table-outer">
                          <div class="filter-row">
                              <div class="filter-group">
                                  <span class="type-badge green">Type:</span>
                                  <select id="pendingTypeFilter" onchange="applyFilter('pending', 'pendingTableBody')">
                                      <option value="All">All Types</option>
                                      <option value="Community Needs Assessment Consolidated Report">Community Needs Assessment Consolidated Report</option>
                                      <option value="3-year Development Plan">3-year Development Plan</option>
                                      <option value="Program Design">Program Design</option>    
                                      <option value="Departmental Planned Initiative Report">Departmental Planned Initiative Report</option>
                                      <option value="Monthly Accomplishment Report">Monthly Accomplishment Report</option>
                                  </select>
                              </div>
                              <div class="filter-group">
                                  <span class="type-badge green">From:</span>
                                  <input type="date" id="pendingDateFrom" onchange="applyFilter('pending', 'pendingTableBody')">
                              </div>
                              <div class="filter-group">
                                  <span class="type-badge green">To:</span>
                                  <input type="date" id="pendingDateTo" onchange="applyFilter('pending', 'pendingTableBody')">
                              </div>
                              <button type="button" id="pendingShowAllBtn" class="show-all-btn" onclick="showAllReports('pending', 'pendingTableBody')">
                                  Show All
                              </button>
                          </div>

                          <table class="report-table">
                              <thead>
                                  <tr>
                                      <th class="green-text">Type</th>
                                      <th class="green-text">Title</th>
                                      <th class="green-text">Created by</th>
                                      <th class="green-text">Department</th>
                                      <th class="green-text">Date</th>
                                      <th class="green-text">Status</th>
                            
                                  </tr>
                              </thead>
                              <tbody id="pendingTableBody">
                                  <tr>
                                      <td colspan="6" class="no-reports">No pending reports to display.</td>
                                  </tr>
                              </tbody>
                          </table>
                      </div>
                  </section>
                  
            </main>
        </div>
    </div>
    <script src="/SYSTEM_VERSION_!/coordinator/Dashboard/JS/getPending.js?v=20260519b"></script>
    <script src="/SYSTEM_VERSION_!/coordinator/Dashboard/JS/getplan.js?v=20260519b"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="/SYSTEM_VERSION_!/coordinator/Dashboard/barangay-table.js?v=20260519b"></script>
    <script src="/SYSTEM_VERSION_!/coordinator/Dashboard/darkmode.js"></script>
</body>
</html>
